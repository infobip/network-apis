server:
  port: 8080

verify:
  zombie-requests-check-rate: "0 */20 * * * *"
  callback-endpoint: http://localhost:${server.port}/verify/callback
  using-proxy: false
  infobip-base-url:
    iov3: 10.41.12.100

infobip-http-client:
  timeout: 15s

infobip.remoting:
  server:
    autostart: true
    properties:
      mml.rmi.enabled: false

HTTP_RMI_PORT: 8081